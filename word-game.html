<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🎯 낱말 카드 찾기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; min-height: -webkit-fill-available; background: linear-gradient(135deg, #312e81, #581c87, #831843); padding: 12px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
    h1 { color: white; font-size: 24px; margin-bottom: 8px; }
    .hidden { display: none !important; }
    .menu { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; max-width: 400px; width: 100%; text-align: center; }
    .menu-icon { font-size: 48px; margin-bottom: 12px; }
    .menu h2 { color: white; font-size: 24px; margin-bottom: 4px; }
    .menu p { color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 16px; }
    .menu-label { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 8px; }
    .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .category-btn { padding: 8px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.2); color: white; }
    .category-btn.active { background: #facc15; color: #581c87; transform: scale(1.05); }
    .category-btn span { display: block; font-size: 18px; }
    .difficulty-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .diff-btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.2); color: white; }
    .diff-btn.active { background: #4ade80; color: #166534; transform: scale(1.05); }
    .start-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 20px; font-weight: bold; cursor: pointer; background: linear-gradient(90deg, #facc15, #fb923c); color: #581c87; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.2s; }
    .start-btn:active { transform: scale(0.95); }
    .sound-row { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .sound-btn { padding: 8px 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 13px; }
    .sound-btn.on { background: #22c55e; color: white; }
    .sound-btn.off { background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); }
    .game { width: 100%; max-width: 400px; }
    .game-left, .game-right { width: 100%; }
    .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
    .stat { background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 8px; color: white; }
    .stat-value { font-weight: bold; }
    .score-value { color: #fde047; }
    .combo-value { color: #fdba74; }
    .lives-value { color: #fca5a5; }
    .timer-bar { height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
    .timer-fill { height: 100%; transition: width 1s linear, background-color 0.3s; border-radius: 5px; }
    .timer-green { background: #22c55e; }
    .timer-yellow { background: #eab308; }
    .timer-red { background: #ef4444; }
    .question-card { background: white; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; overflow: visible; }
    .question-label { color: #6b7280; font-size: 14px; margin-bottom: 8px; }
    .question-word { font-size: 36px; font-weight: bold; color: #7c3aed; }
    .combo-display { color: #f97316; font-weight: bold; margin-top: 8px; }
    .options-grid { display: grid; gap: 12px; }
    .options-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .options-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .option-btn { aspect-ratio: 1.8; border-radius: 16px; border: none; font-size: 64px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
    .option-btn:active { transform: scale(0.95); }
    .option-btn:disabled { cursor: default; }
    .option-btn.correct { box-shadow: 0 0 0 4px #4ade80; background: #dcfce7 !important; }
    .option-btn.faded { opacity: 0.5; }
    .check-mark { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; background: #22c55e; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
    .color-0 { background: linear-gradient(135deg, #fb7185, #f43f5e); }
    .color-1 { background: linear-gradient(135deg, #fb923c, #f97316); }
    .color-2 { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .color-3 { background: linear-gradient(135deg, #34d399, #10b981); }
    .color-4 { background: linear-gradient(135deg, #22d3ee, #06b6d4); }
    .color-5 { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
    .color-6 { background: linear-gradient(135deg, #a78bfa, #8b5cf6); }
    .color-7 { background: linear-gradient(135deg, #f472b6, #ec4899); }
    .feedback-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; animation: fadeInOut 0.8s ease-in-out forwards; }
    .feedback-box { padding: 32px 40px; border-radius: 24px; background: rgba(255, 220, 80, 0.95); border: 4px solid rgba(255,255,255,0.3); box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; animation: popIn 0.3s ease-out; }
    .feedback-icon { font-size: 60px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
    .feedback-icon.correct { color: #22c55e; }
    .feedback-icon.wrong { color: #ef4444; }
    .feedback-text { font-size: 20px; font-weight: bold; margin-top: 8px; }
    .feedback-text.correct { color: #166534; }
    .feedback-text.wrong { color: #991b1b; }
    .feedback-answer { color: #92400e; font-size: 14px; margin-top: 4px; }
    .score-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; }
    .score-popup-text { font-size: 36px; font-weight: 900; color: #facc15; text-shadow: 0 0 20px rgba(255,200,0,0.8), 0 0 40px rgba(255,150,0,0.5); animation: popBurst 0.8s ease-out forwards; }
    .particle { position: absolute; width: 12px; height: 12px; border-radius: 50%; animation: particleBurst 0.8s ease-out forwards; }
    .star { position: absolute; font-size: 24px; animation: starBurst 0.6s ease-out forwards; }
    .gameover { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; text-align: center; }
    .gameover-icon { font-size: 60px; margin-bottom: 16px; }
    .gameover h2 { color: #facc15; font-size: 28px; margin-bottom: 16px; }
    .gameover-stats { background: rgba(255,255,255,0.2); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .gameover-stats p { color: white; margin: 8px 0; }
    .final-score { font-size: 20px; }
    .final-score span { color: #fde047; font-size: 24px; font-weight: bold; }
    .accuracy span { color: #86efac; font-weight: bold; }
    .max-combo span { color: #fdba74; font-weight: bold; }
    .gameover-btns { display: flex; gap: 12px; }
    .retry-btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; background: linear-gradient(90deg, #facc15, #fb923c); color: #581c87; transition: transform 0.2s; }
    .menu-btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.2); color: white; transition: transform 0.2s; }
    .retry-btn:active, .menu-btn:active { transform: scale(0.95); }
    .footer { margin-top: 12px; color: rgba(255,255,255,0.4); font-size: 12px; }
    .bowl-container { background: rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; text-align: center; }
    .bowl-label { color: rgba(255,255,255,0.8); font-size: 14px; margin-right: 8px; }
    .bowl-value { font-size: 18px; letter-spacing: 2px; }
    .quit-btn { width: 100%; margin-top: 12px; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); transition: all 0.2s; }
    .quit-btn:hover { background: rgba(239,68,68,0.5); color: white; }
    .confirm-popup { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 200; }
    .confirm-box { background: white; border-radius: 16px; padding: 24px; max-width: 300px; width: 90%; text-align: center; }
    .confirm-text { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 20px; }
    .confirm-btns { display: flex; flex-direction: column; gap: 10px; }
    .confirm-yes { padding: 12px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; background: #ef4444; color: white; }
    .confirm-no { padding: 12px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; background: #22c55e; color: white; }

    /* 가로모드 */
    @media (orientation: landscape) and (max-height: 500px) {
      body { padding: 8px; justify-content: center; }
      h1 { position: fixed; top: 4px; left: 50%; transform: translateX(-50%); font-size: 16px; margin: 0; z-index: 10; }
      .menu { max-width: 95vw; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
      .menu-header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 12px; }
      .menu-icon { font-size: 32px; margin: 0; }
      .menu h2 { font-size: 18px; margin: 0; }
      .menu > p:first-of-type { grid-column: 1 / -1; margin-bottom: 0; }
      .menu-label { margin-bottom: 4px; font-size: 12px; }
      .category-grid { gap: 4px; margin-bottom: 0; }
      .category-btn { padding: 4px; font-size: 11px; }
      .category-btn span { font-size: 14px; }
      .difficulty-row { margin-bottom: 0; gap: 4px; }
      .diff-btn { padding: 4px 8px; font-size: 12px; }
      .start-btn { grid-column: 1 / -1; padding: 10px; font-size: 16px; }
      .sound-row { grid-column: 1 / -1; margin-top: 8px; gap: 6px; }
      .sound-btn { padding: 4px 8px; font-size: 11px; }
      
      .game { display: flex; flex-direction: row; max-width: none; width: 100%; margin-top: 28px; gap: 12px; align-items: center; justify-content: center; }
      .game-left { width: 180px; min-width: 180px; display: flex; flex-direction: column; gap: 6px; }
      .game-right { flex: 1; max-width: 400px; display: flex; align-items: center; justify-content: center; }
      .stats { font-size: 11px; gap: 4px; margin-bottom: 4px; }
      .stat { padding: 3px 6px; }
      .timer-bar { height: 6px; margin-bottom: 4px; }
      .question-card { padding: 10px; margin-bottom: 0; }
      .question-label { font-size: 11px; margin-bottom: 4px; }
      .question-word { font-size: 24px; }
      .combo-display { font-size: 12px; margin-top: 4px; }
      .options-grid { gap: 8px; }
      .option-btn { font-size: 44px; min-height: 60px; aspect-ratio: 1.8; }
      .check-mark { width: 20px; height: 20px; font-size: 11px; top: 4px; right: 4px; }
      
      .gameover { max-width: 450px; padding: 12px; margin-top: 28px; }
      .gameover-icon { font-size: 36px; margin-bottom: 8px; }
      .gameover h2 { font-size: 20px; margin-bottom: 8px; }
      .gameover-stats { padding: 8px; margin-bottom: 8px; }
      .gameover-stats p { margin: 4px 0; font-size: 14px; }
      .gameover-btns button { padding: 10px; font-size: 14px; }
      
      .feedback-box { padding: 16px 24px; }
      .feedback-icon { font-size: 40px; }
      .feedback-text { font-size: 16px; }
      .footer { display: none; }
      .bowl-container { padding: 4px 8px; margin-bottom: 4px; }
      .bowl-label { font-size: 11px; }
      .bowl-value { font-size: 14px; letter-spacing: 1px; }
      .quit-btn { margin-top: 8px; padding: 6px; font-size: 12px; }
    }

    @media (orientation: landscape) and (min-width: 700px) and (max-height: 500px) {
      .game-left { width: 220px; min-width: 220px; }
      .question-word { font-size: 28px; }
      .option-btn { font-size: 56px; min-height: 70px; aspect-ratio: 1.8; }
    }

    @keyframes fadeInOut { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes popIn { 0% { transform: scale(0.5); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes popBurst { 0% { transform: scale(0) rotate(-10deg); opacity: 0; } 50% { transform: scale(1.4) rotate(5deg); opacity: 1; } 100% { transform: scale(1) translateY(-30px) rotate(0deg); opacity: 0; } }
    @keyframes particleBurst { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
    @keyframes starBurst { 0% { transform: rotate(var(--angle)) translateY(0) scale(0); opacity: 1; } 100% { transform: rotate(var(--angle)) translateY(-60px) scale(1); opacity: 0; } }
  </style>
</head>
<body>
  <h1>🎯 낱말 카드 찾기</h1>
  
  <div id="menuScreen" class="menu">
    <div class="menu-header"><div class="menu-icon">🃏</div><h2>낱말 카드 찾기</h2></div>
    <p>단어를 보고 맞는 그림을 찾아요!</p>
    <div><p class="menu-label">카테고리 선택</p><div class="category-grid" id="categoryGrid"></div></div>
    <div><p class="menu-label">난이도 선택</p><div class="difficulty-row" id="difficultyRow"></div></div>
    <button class="start-btn" id="startBtn">게임 시작!</button>
    <div class="sound-row">
      <button class="sound-btn on" id="sfxBtn">🔊 효과음</button>
      <button class="sound-btn on" id="bgmBtn">🎵 배경음</button>
      <button class="sound-btn on" id="ttsBtn">🗣️ 음성</button>
    </div>
  </div>
  
  <div id="gameScreen" class="game hidden">
    <div class="game-left">
      <div class="stats">
        <div class="stat">점수: <span class="stat-value score-value" id="scoreDisplay">0</span></div>
        <div class="stat">콤보: <span class="stat-value combo-value" id="comboDisplay">0</span>🔥</div>
        <div class="stat">진행: <span class="stat-value" id="progressDisplay">0/20</span></div>
      </div>
      <div class="bowl-container">
        <span class="bowl-label">🍽️ 밥상:</span>
        <span class="bowl-value" id="livesDisplay">🥣🥣🥣🥣🥣🥣🥣🥣🥣🥣</span>
      </div>
      <div class="timer-bar"><div class="timer-fill timer-green" id="timerFill"></div></div>
      <div class="question-card">
        <p class="question-label">이 단어의 그림을 찾으세요!</p>
        <div class="question-word" id="questionWord"></div>
        <div class="combo-display hidden" id="comboBonus"></div>
        <div class="score-popup hidden" id="scorePopup"></div>
      </div>
    </div>
    <div class="game-right">
      <div class="options-grid cols-2" id="optionsGrid"></div>
      <button class="quit-btn" id="quitBtn">🏳️ 포기하기</button>
    </div>
  </div>
  
  <div id="gameoverScreen" class="gameover hidden">
    <div class="gameover-icon" id="gameoverIcon">🎉</div><h2 id="gameoverTitle">맛있게 먹자!</h2>
    <div class="gameover-stats">
      <p class="final-score">최종 점수: <span id="finalScore">0</span></p>
      <p class="accuracy">정답률: <span id="finalAccuracy">0/0 (0%)</span></p>
      <p class="max-combo">최고 콤보: <span id="finalCombo">0</span>🔥</p>
      <p class="bowls-filled">채운 그릇: <span id="finalBowls">0/10</span>🍽️</p>
    </div>
    <div class="gameover-btns"><button class="retry-btn" id="retryBtn">다시 하기</button><button class="menu-btn" id="menuBtn">메뉴로</button></div>
  </div>

  <div id="confirmPopup" class="confirm-popup hidden">
    <div class="confirm-box">
      <p class="confirm-text">정말 포기하시겠어요?</p>
      <div class="confirm-btns">
        <button class="confirm-yes" id="confirmYes">네, 포기할래요</button>
        <button class="confirm-no" id="confirmNo">아니요, 계속할래요</button>
      </div>
    </div>
  </div>
  
  <div id="feedbackOverlay" class="feedback-overlay hidden">
    <div class="feedback-box">
      <div class="feedback-icon" id="feedbackIcon">◯</div>
      <div class="feedback-text" id="feedbackText">정답!</div>
      <div class="feedback-answer hidden" id="feedbackAnswer"></div>
    </div>
  </div>
  <p class="footer">단어를 보고 맞는 그림 카드를 터치하세요!</p>

  <script>
    const TTSManager = { enabled: true, speak(text) { if (!this.enabled || !('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 0.9; u.pitch = 1.1; window.speechSynthesis.speak(u); } };
    const wordSets = {
