  일반인: {
    label:"일반인",icon:"💼",
    patterns:[
      {

        signals:["구체적 숫자·% 등장","'약 ~명', '~년 기준'","소수점 포함 통계","순위·비교 수치 단정"],
        checks:["통계청·기관 직접 조회","원출처 보고서 확인","달력·공식앱으로 대조","숫자 앞뒤 맥락 재확인"],
        caseAI:"'아인슈타인의 뇌는 일반인보다 17% 더 무거웠다'",
        caseFact:"뇌 무게는 평균과 동일. 두정엽 특정 영역이 15% 더 넓음 — 무게가 아닌 구조의 차이",
        src:"Source: Witelson et al., The Lancet, 1999",
        demo:{title:"직접 검색해봅시다",steps:[
          {a:"'아인슈타인 뇌 연구' 검색",d:"구글·네이버에서 검색해보세요",link:"https://www.google.com/search?q=아인슈타인+뇌+연구+무게"},
          {a:"신뢰할 기사 고르기",d:"대학·연구소·신문사 기사 우선 선택",link:""},
          {a:"AI 말한 내용과 비교",d:"'17% 더 무겁다' vs 실제 기사 내용",link:""},
          {a:"결론 확인",d:"무게는 같고, 구조가 달랐다는 것 확인",link:""},
        ]}
      },
      {
        num:"02",icon:"🏛️",name:"출처·인용 날조",sub:"실존하지 않는 논문·기관을 그럴듯하게 생성",
        signals:["'국제기구에 따르면'","학술지명·저자명 조합","구체 연도 포함 인용","'~연구에서 증명됨'"],
        checks:["학술 검색엔진 검색","기관 공식 원문","의학 DB 직접 조회","논문 고유번호 실존 확인"],
        caseAI:"'국제 보건기구가 커피를 확정 발암물질로 분류했습니다'",
        caseFact:"해당 기구는 커피를 발암물질 목록에서 제외했음 — 정반대 결론입니다.",
        src:"Source: IARC Monographs Vol.116, 2016",

          {a:"신뢰할 기사 선택",d:"방송사·의학 전문 매체 우선",link:""},
          {a:"기관 공식 사이트 방문",d:"IARC(국제암연구소) 직접 확인",link:"https://www.iarc.who.int"},
          {a:"결론 비교",d:"AI: 발암물질 ↔ 실제: 분류 제외",link:""},
        ]}
      },
      {
        num:"05",icon:"🌐",name:"과잉일반화",sub:"부분 사실을 전체·항상·모든에 적용",
        signals:["'완전히'·'모든'·'항상'","'절대'·'100%'","예외 없는 단정 표현","'~하면 무조건' 구조"],
        checks:["'반례가 있지 않을까?' 질문","생애주기 전체 분석 검색","조건·맥락 제한 확인","국제기구 다자 연구 비교"],
        caseAI:"'전기차는 완전한 친환경 자동차입니다'",
        caseFact:"배터리 생산·폐기 과정 탄소 발생 존재. 생애주기 전체 고려 필요.",

        demo:{title:"직접 검색해봅시다",steps:[
          {a:"'전기차 환경 단점' 검색",d:"구글·네이버에서 검색",link:"https://www.google.com/search?q=전기차+환경+단점+배터리"},
          {a:"뉴스 기사 2-3개 읽기",d:"배터리 생산·폐기 환경 문제 기사",link:""},
          {a:"'완전한 친환경'인지 확인",d:"기사 내용과 AI 말 비교하기",link:""},
          {a:"결론 내리기",d:"'상대적으로 친환경' — 완전은 아님",link:""},

const AUD_KEYS = ["유아","초등저","초등고","중고생","대학원","일반인"];
const STEP_LABELS = ["신호어","검증방법","AI 사례","실제 정답","검색 실습"];

function App() {
  const [audKey, setAudKey] = useState(null);
  const [patIdx, setPatIdx] = useState(0);
  const [step, setStep] = useState(0);

  if (!audKey) {
    return (
      <div style={{minHeight:"100vh",background:"#0D0F14",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 20px",gap:"20px"}}>
        <div style={{fontSize:"clamp(20px,5vw,30px)",fontWeight:"900",color:"#E8EAF0",textAlign:"center",lineHeight:1.35}}>
          오늘 배울 것:<br/><span style={{color:"#5B8CFF"}}>AI가 거짓말하는 3가지 방법</span>
        </div>
        <div style={{fontSize:"14px",color:"#8A90A0",textAlign:"center"}}>대상을 선택하면 맞춤 강의가 시작됩니다</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"12px",maxWidth:"680px",width:"100%"}}>
          {AUD_KEYS.map(k => (
            <button key={k} onClick={() => { setAudKey(k); setPatIdx(0); setStep(0); }}
              style={{border:"2px solid #2A3050",borderRadius:"12px",padding:"18px 10px",textAlign:"center",cursor:"pointer",background:"#181B24",color:"#E8EAF0",fontSize:"14px",fontFamily:"inherit"}}>
              <div style={{fontSize:"28px",marginBottom:"8px"}}>{DATA[k].icon}</div>
              <div style={{fontWeight:"700"}}>{DATA[k].label}</div>
            </button>
          ))}
        </div>
        <div style={{fontSize:"11px",color:"#2A3050",marginTop:"8px"}}>TheOtherLooAI · MakeBuildLabs</div>
      </div>
    );
  }

  const aud = DATA[audKey];
  const pat = aud.patterns[patIdx];
  const maxStep = 4;
  const totalPats = aud.patterns.length;

  const goNext = () => {
    if (step < maxStep) setStep(s => s+1);
    else if (patIdx < totalPats-1) { setPatIdx(p => p+1); setStep(0); }
  };
  const goPrev = () => {
    if (step > 0) setStep(s => s-1);
    else if (patIdx > 0) { setPatIdx(p => p-1); setStep(maxStep); }
  };
  const isFirst = patIdx===0 && step===0;
  const isLast  = patIdx===totalPats-1 && step===maxStep;

  const patColor = {"01":"#3B82F6","02":"#8B5CF6","05":"#F59E0B"}[pat.num] || "#5B8CFF";

  return (
    <div style={{minHeight:"100vh",background:"#0D0F14",color:"#E8EAF0",fontFamily:"inherit",paddingBottom:"72px"}}>

      {/* 상단 바 */}
      <div style={{background:"#13161E",borderBottom:"1px solid #1E2230",padding:"12px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:10}}>
        <div style={{fontSize:"13px",color:"#8A90A0"}}>
          <span style={{fontWeight:"700",color:"#E8EAF0"}}>{aud.label}</span>
          {" · 패턴 "}{patIdx+1}/{totalPats}
        </div>
        <button onClick={() => setAudKey(null)}
          style={{background:"#2A3050",border:"none",color:"#E8EAF0",padding:"6px 14px",borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontFamily:"inherit"}}>
          대상 변경
        </button>
      </div>

      {/* 진행 바 */}
      <div style={{height:"3px",background:"#1E2230"}}>
        <div style={{height:"100%",background:patColor,width:`${((patIdx*5+step+1)/(totalPats*5))*100}%`,transition:"width .3s"}}/>
      </div>

      <div style={{maxWidth:"800px",margin:"0 auto",padding:"24px 16px"}}>

        {/* 패턴 헤더 */}
        <div style={{display:"flex",alignItems:"center",gap:"14px",marginBottom:"20px",padding:"20px",background:"#181B24",borderRadius:"14px",borderLeft:`4px solid ${patColor}`}}>
          <span style={{fontSize:"36px"}}>{pat.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:"clamp(18px,4vw,24px)",fontWeight:"900"}}>{pat.name}</div>
            <div style={{fontSize:"13px",color:"#8A90A0",marginTop:"3px"}}>{pat.sub}</div>
          </div>
          <div style={{fontSize:"11px",background:patColor,padding:"4px 10px",borderRadius:"20px",color:"#fff",whiteSpace:"nowrap",fontWeight:"700"}}>
            {pat.num}
          </div>
        </div>

        {/* 신호어 (step 0+) */}
        {step >= 0 && (
          <div style={{marginBottom:"16px",background:"#181B24",borderRadius:"12px",padding:"20px",border:"1px solid #1E2230"}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px",paddingBottom:"12px",borderBottom:"1px solid #1E2230"}}>
              <span>⚡</span>
              <span style={{fontSize:"12px",fontWeight:"700",color:"#F59E0B",letterSpacing:"0.06em"}}>이런 표현이 나오면 의심하세요</span>
            </div>
            {pat.signals.map((s,i) => (
              <div key={i} style={{display:"flex",alignItems:"center",gap:"12px",padding:"8px 0",borderBottom:i<pat.signals.length-1?"1px solid #13161E":"none"}}>
                <div style={{width:"6px",height:"6px",borderRadius:"50%",background:"#F59E0B",flexShrink:0}}/>
                <span style={{fontSize:"clamp(14px,3.5vw,17px)",color:"#E8EAF0"}}>{s}</span>
              </div>
            ))}
          </div>
        )}

        {/* 검증방법 (step 1+) */}
        {step >= 1 && (
          <div style={{marginBottom:"16px",background:"#181B24",borderRadius:"12px",padding:"20px",border:"1px solid #1E2230"}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px",paddingBottom:"12px",borderBottom:"1px solid #1E2230"}}>
              <span>✓</span>
              <span style={{fontSize:"12px",fontWeight:"700",color:"#34D399",letterSpacing:"0.06em"}}>이렇게 확인하세요</span>
            </div>
            {pat.checks.map((c,i) => (
              <div key={i} style={{display:"flex",alignItems:"center",gap:"12px",padding:"8px 0",borderBottom:i<pat.checks.length-1?"1px solid #13161E":"none"}}>
                <div style={{width:"6px",height:"6px",borderRadius:"50%",background:"#34D399",flexShrink:0}}/>
                <span style={{fontSize:"clamp(14px,3.5vw,17px)",color:"#E8EAF0"}}>{c}</span>
              </div>
            ))}
          </div>
        )}

        {/* AI 사례 (step 2+) */}
        {step >= 2 && (
          <div style={{marginBottom:"12px",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:"12px",padding:"18px 20px"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#F87171",marginBottom:"8px",letterSpacing:"0.06em"}}>🤖 AI 출력 (환각)</div>
            <div style={{fontSize:"clamp(15px,3.5vw,18px)",lineHeight:"1.7",color:"#E8EAF0"}}>{pat.caseAI}</div>
          </div>
        )}

        {/* 실제 정답 (step 3+) */}
        {step >= 3 && (
          <div style={{marginBottom:"16px",background:"rgba(52,211,153,0.07)",border:"1px solid rgba(52,211,153,0.28)",borderRadius:"12px",padding:"18px 20px"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#34D399",marginBottom:"8px",letterSpacing:"0.06em"}}>✓ 실제 사실</div>
            <div style={{fontSize:"clamp(15px,3.5vw,18px)",lineHeight:"1.7",color:"#E8EAF0"}}>{pat.caseFact}</div>
            {pat.src && <div style={{fontSize:"11px",color:"#4A5270",marginTop:"8px"}}>{pat.src}</div>}
          </div>
        )}

        {/* 검색 실습 (step 4) */}
        {step >= 4 && (
          <div style={{background:"#181B24",border:"1px solid #1E2230",borderRadius:"12px",padding:"20px"}}>
            <div style={{fontSize:"13px",fontWeight:"700",color:"#5B8CFF",marginBottom:"16px"}}>🔍 {pat.demo.title}</div>
            {pat.demo.steps.map((s,i) => (
              <div key={i} style={{display:"flex",gap:"12px",marginBottom:"16px"}}>
                <div style={{width:"28px",height:"28px",borderRadius:"50%",background:"#2A3050",color:"#5B8CFF",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"12px",flexShrink:0,marginTop:"2px"}}>{i+1}</div>
                <div>
                  <div style={{fontSize:"clamp(14px,3.5vw,16px)",fontWeight:"700",marginBottom:"3px"}}>{s.a}</div>
                  <div style={{fontSize:"13px",color:"#8A90A0",lineHeight:"1.5"}}>{s.d}</div>
                  {s.link && (
                    <a href={s.link} target="_blank" rel="noopener noreferrer"
                      style={{display:"inline-block",marginTop:"6px",fontSize:"12px",padding:"5px 12px",borderRadius:"6px",border:"1px solid #5B8CFF",color:"#5B8CFF",textDecoration:"none"}}>
                      검색 열기 ↗
                    </a>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* 하단 컨트롤 */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0A0C10",borderTop:"1px solid #1E2230",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:"12px",color:"#8A90A0"}}>{STEP_LABELS[step]}</div>
        <div style={{display:"flex",gap:"8px"}}>
          <button onClick={goPrev} disabled={isFirst}
            style={{background:"#1E2230",border:"none",color:isFirst?"#3A4060":"#E8EAF0",padding:"9px 18px",borderRadius:"8px",cursor:isFirst?"default":"pointer",fontSize:"14px",fontFamily:"inherit"}}>
            ◀ 이전
          </button>
          <button onClick={goNext} disabled={isLast}
            style={{background:isLast?"#1E2230":patColor,border:"none",color:isLast?"#3A4060":"#fff",padding:"9px 18px",borderRadius:"8px",cursor:isLast?"default":"pointer",fontSize:"14px",fontWeight:"700",fontFamily:"inherit"}}>
            다음 ▶
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
